<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Untuk Kamu 💖</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
  color: white;
}

/* INTRO */
#intro {
  position: absolute;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  background: radial-gradient(circle, #1a001f, #000);
}

button {
  padding: 12px 20px;
  border-radius: 20px;
  border: none;
  background: pink;
  box-shadow: 0 0 15px pink;
  cursor: pointer;
}

/* TEXT */
#text {
  position: absolute;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 36px;
  color: pink;
  text-align: center;
  text-shadow: 0 0 20px pink, 0 0 40px hotpink;
  white-space: pre-line;
}

/* 🌹 ROSE IMAGE */
#rose {
  position: absolute;
  bottom: 5%;
  left: 50%;
  transform: translateX(-50%);
  width: 220px;

  /* glow */
  filter: drop-shadow(0 0 20px pink) drop-shadow(0 0 40px hotpink);

  animation: sway 5s ease-in-out infinite, breathe 4s ease-in-out infinite;
}

/* goyang */
@keyframes sway {
  0% { transform: translateX(-50%) rotate(-2deg); }
  50% { transform: translateX(-50%) rotate(2deg); }
  100% { transform: translateX(-50%) rotate(-2deg); }
}

/* “hidup” (nafas) */
@keyframes breathe {
  0%,100% { scale: 1; }
  50% { scale: 1.05; }
}

canvas {
  display: none;
}
</style>
</head>

<body>

<div id="intro">
  <h2>Hai kamu... siap lihat sesuatu? 😊</h2>
  <button onclick="start()">Mulai 💖</button>
</div>

<div id="text"></div>

<img id="rose" src="https://i.imgur.com/3QZ7Z7X.png">

<canvas id="canvas"></canvas>

<script>
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let stars = [];

// START
function start() {
  document.getElementById("intro").style.display = "none";
  canvas.style.display = "block";

  init();
  animate();

  playTexts();
}

// ✍️ TYPE EFFECT
function typeText(text, speed, callback) {
  let i = 0;
  let el = document.getElementById("text");
  el.innerHTML = "";

  let interval = setInterval(() => {
    el.innerHTML += text.charAt(i);
    i++;
    if (i >= text.length) {
      clearInterval(interval);
      if (callback) setTimeout(callback, 2000);
    }
  }, speed);
}

// TEXT FLOW
function playTexts() {
  typeText("Hai Tiwi Cantikk 💖", 60, () => {
    typeText("Semoga aku bisa ngertiin kamu ya hehe...\nMaaf kalau sering bikin kamu marah 💔", 40, () => {
      typeText("Love you sayang 💖", 70);
    });
  });
}

// ⭐ STAR
function createStar() {
  return {
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 1.5,
    alpha: Math.random(),
    twinkle: Math.random() * 0.02
  };
}

function init() {
  for (let i = 0; i < 200; i++) stars.push(createStar());
}

// DRAW STAR
function drawStar(s) {
  ctx.beginPath();
  ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
  ctx.fillStyle = "white";
  ctx.globalAlpha = s.alpha;
  ctx.fill();
  ctx.globalAlpha = 1;
}

// UPDATE
function update() {
  stars.forEach(s => {
    s.alpha += s.twinkle;
    if (s.alpha <= 0 || s.alpha >= 1) s.twinkle *= -1;
  });
}

// LOOP
function animate() {
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  stars.forEach(drawStar);

  update();
  requestAnimationFrame(animate);
}
</script>

</body>
</html>
