<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Untuk Kamu 💖</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
  color: #ffc0cb;

  background: url('https://images.unsplash.com/photo-1446776811953-b23d57bd21aa') no-repeat center/cover;
}

/* TEXT */
#textBox {
  position: absolute;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

.line {
  font-size: 38px;
  margin: 15px 0;
  opacity: 0;
  text-shadow: 0 0 20px pink, 0 0 40px hotpink;
}

.show {
  animation: fadeIn 2s forwards;
}

@keyframes fadeIn {
  from {opacity:0; transform: translateY(20px);}
  to {opacity:1; transform: translateY(0);}
}

/* 🌹 ROSE (PURE CSS) */
#rose {
  position: absolute;
  bottom: 5%;
  left: 50%;
  transform: translateX(-50%);
  width: 200px;
  height: 200px;

  animation: sway 5s ease-in-out infinite,
             breathe 4s ease-in-out infinite;
}

/* batang */
.stem {
  position: absolute;
  width: 6px;
  height: 120px;
  background: linear-gradient(green, darkgreen);
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
}

/* daun */
.leaf {
  position: absolute;
  width: 40px;
  height: 20px;
  background: green;
  border-radius: 50%;
}

.leaf.left {
  left: 20px;
  bottom: 40px;
  transform: rotate(-30deg);
}

.leaf.right {
  right: 20px;
  bottom: 60px;
  transform: rotate(30deg);
}

/* kelopak */
.petal {
  position: absolute;
  width: 80px;
  height: 80px;
  background: radial-gradient(circle, red, darkred);
  border-radius: 50%;
  top: 0;
  left: 50%;
  transform-origin: bottom center;
  filter: drop-shadow(0 0 15px red);
}

/* posisi kelopak */
.p1 { transform: translateX(-50%) rotate(0deg); }
.p2 { transform: translateX(-50%) rotate(60deg); }
.p3 { transform: translateX(-50%) rotate(120deg); }
.p4 { transform: translateX(-50%) rotate(180deg); }
.p5 { transform: translateX(-50%) rotate(240deg); }
.p6 { transform: translateX(-50%) rotate(300deg); }

/* animasi */
@keyframes sway {
  0% { transform: translateX(-50%) rotate(-2deg); }
  50% { transform: translateX(-50%) rotate(2deg); }
  100% { transform: translateX(-50%) rotate(-2deg); }
}

@keyframes breathe {
  0%,100% { scale: 1; }
  50% { scale: 1.05; }
}

/* sparkle */
.sparkle {
  position: absolute;
  width: 4px;
  height: 4px;
  background: gold;
  border-radius: 50%;
  animation: sparkleAnim 2s infinite;
}

@keyframes sparkleAnim {
  0% { opacity:1; transform: translateY(0);}
  100% { opacity:0; transform: translateY(-40px);}
}

</style>
</head>

<body>

<div id="textBox">
  <div id="t1" class="line">Hai Tiwi Cantikk 💖</div>
  <div id="t2" class="line">Semoga aku bisa ngertiin kamu ya hehe...</div>
  <div id="t3" class="line">Maaf kalau sering bikin kamu marah 💖</div>
  <div id="t4" class="line">Love you sayang 💖</div>
</div>

<!-- 🌹 ROSE -->
<div id="rose">
  <div class="stem"></div>
  <div class="leaf left"></div>
  <div class="leaf right"></div>

  <div class="petal p1"></div>
  <div class="petal p2"></div>
  <div class="petal p3"></div>
  <div class="petal p4"></div>
  <div class="petal p5"></div>
  <div class="petal p6"></div>
</div>

<script>
// TEXT TIMELINE
setTimeout(()=>show("t1"),1000);
setTimeout(()=>show("t2"),3000);
setTimeout(()=>show("t3"),5000);
setTimeout(()=>show("t4"),7000);

function show(id){
  document.getElementById(id).classList.add("show");
}

// sparkle
function sparkle(){
  let s = document.createElement("div");
  s.className = "sparkle";

  let r = document.getElementById("rose").getBoundingClientRect();

  s.style.left = r.left + Math.random()*r.width + "px";
  s.style.top = r.top + Math.random()*r.height + "px";

  document.body.appendChild(s);
  setTimeout(()=>s.remove(),2000);
}

setInterval(sparkle,150);
</script>

</body>
</html>
