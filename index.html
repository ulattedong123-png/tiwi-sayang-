<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Untuk Kamu 💖</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
  color: #ffc0cb;

  /* 🌌 GALAXY REAL */
  background: url('https://images.unsplash.com/photo-1446776811953-b23d57bd21aa') no-repeat center center/cover;
}

/* 🌫️ overlay biar dreamy */
body::after {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, rgba(255,105,180,0.1), black);
  pointer-events: none;
}

/* TEXT CONTAINER */
#textBox {
  position: absolute;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  width: 80%;
}

/* TEXT STYLE */
.line {
  font-size: 38px;
  margin: 15px 0;
  opacity: 0;
  text-shadow: 0 0 20px pink, 0 0 40px hotpink;
}

/* SHOW ANIMATION */
.show {
  animation: fadeIn 2s forwards;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px);}
  to { opacity: 1; transform: translateY(0);}
}

/* 🌹 ROSE */
#rose {
  position: absolute;
  bottom: 5%;
  left: 50%;
  transform: translateX(-50%);
  width: 250px;

  filter: drop-shadow(0 0 20px gold)
          drop-shadow(0 0 40px orange);

  animation: sway 5s ease-in-out infinite,
             breathe 4s ease-in-out infinite;
}

@keyframes sway {
  0% { transform: translateX(-50%) rotate(-2deg); }
  50% { transform: translateX(-50%) rotate(2deg); }
  100% { transform: translateX(-50%) rotate(-2deg); }
}

@keyframes breathe {
  0%,100% { scale: 1; }
  50% { scale: 1.05; }
}

/* ✨ SPARKLE */
.sparkle {
  position: absolute;
  width: 4px;
  height: 4px;
  background: gold;
  border-radius: 50%;
  opacity: 0.8;
  animation: sparkleAnim 2s infinite ease-in-out;
}

@keyframes sparkleAnim {
  0% { transform: translateY(0) scale(1); opacity: 1;}
  100% { transform: translateY(-40px) scale(0); opacity: 0;}
}

</style>
</head>

<body>

<div id="textBox">
  <div id="t1" class="line">Hai Tiwi Cantikk 💖</div>
  <div id="t2" class="line">Semoga aku bisa ngertiin kamu ya hehe...</div>
  <div id="t3" class="line">Maaf kalau sering bikin kamu marah 💖</div>
  <div id="t4" class="line">Love you sayang 💖</div>
</div>

<!-- 🌹 MAWAR REAL -->
<img id="rose" src="https://pngimg.com/uploads/rose/rose_PNG659.png">

<script>

// 🎬 TEXT TIMELINE (biar kayak foto, muncul satu-satu)
setTimeout(() => show("t1"), 1000);
setTimeout(() => show("t2"), 3000);
setTimeout(() => show("t3"), 5000);
setTimeout(() => show("t4"), 7000);

function show(id) {
  document.getElementById(id).classList.add("show");
}

// ✨ SPARKLE EFFECT DI SEKITAR MAWAR
function createSparkle() {
  const s = document.createElement("div");
  s.className = "sparkle";

  let rose = document.getElementById("rose");
  let rect = rose.getBoundingClientRect();

  s.style.left = rect.left + Math.random() * rect.width + "px";
  s.style.top = rect.top + Math.random() * rect.height + "px";

  document.body.appendChild(s);

  setTimeout(() => s.remove(), 2000);
}

// spawn sparkle terus
setInterval(createSparkle, 150);

</script>

</body>
</html>
