<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>semoga kamu suka ya 💖</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
  color: white;
}

/* INTRO */
#intro {
  position: absolute;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  background: radial-gradient(circle, #1a001f, #000);
}

button {
  margin: 5px;
  padding: 12px 20px;
  border-radius: 20px;
  border: none;
  background: linear-gradient(45deg, pink, hotpink);
  box-shadow: 0 0 15px pink;
  cursor: pointer;
  color: white;
}

/* 💖 TEXT CENTER */
#text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 38px;
  color: pink;
  text-shadow: 0 0 20px pink, 0 0 40px hotpink;
  text-align: center;
  white-space: pre-line;
}

/* 🌹 ROSE */
#rose {
  position: absolute;
  bottom: 10%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 60px;
  animation: sway 4s infinite ease-in-out;
}

@keyframes sway {
  0% { transform: translateX(-50%) rotate(-3deg); }
  50% { transform: translateX(-50%) rotate(3deg); }
  100% { transform: translateX(-50%) rotate(-3deg); }
}

canvas { display: none; }
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
  <h2 id="question">Hai kamu... hari ini gimana? 😊</h2>
  <button onclick="start()">yuk lanjut 💖</button>
</div>

<!-- TEXT -->
<div id="text"></div>

<!-- ROSE -->
<div id="rose">🌹</div>

<canvas id="canvas"></canvas>

<script>
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let flowers = [];
let stars = [];

// START
function start() {
  document.getElementById("intro").style.display = "none";
  canvas.style.display = "block";

  init();
  animate();

  playTexts();
}

// ✍️ TYPE EFFECT
function typeText(text, speed, callback) {
  let i = 0;
  let el = document.getElementById("text");
  el.innerHTML = "";

  let interval = setInterval(() => {
    el.innerHTML += text.charAt(i);
    i++;
    if (i >= text.length) {
      clearInterval(interval);
      if (callback) setTimeout(callback, 2000);
    }
  }, speed);
}

// 🎬 TEXT FLOW
function playTexts() {
  typeText("Hai Tiwi Cantikk 💖", 50, () => {
    typeText("Semoga aku bisa ngertiin kamu ya hehe...\nMaaf kalau sering bikin kamu marah 💔", 40, () => {
      typeText("Love you sayang 💖", 60);
    });
  });
}

// 🌸 FLOWER
function createFlower() {
  return {
    x: Math.random() * canvas.width,
    y: canvas.height + Math.random() * 200,
    size: 0,
    maxSize: 2 + Math.random() * 5,
    speed: 0.3 + Math.random(),
    growth: 0.01 + Math.random() * 0.02,
    sway: Math.random() * Math.PI * 2
  };
}

// ⭐ STAR
function createStar() {
  return {
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 1.5,
    alpha: Math.random(),
    twinkle: Math.random() * 0.02
  };
}

function init() {
  for (let i = 0; i < 80; i++) flowers.push(createFlower());
  for (let i = 0; i < 150; i++) stars.push(createStar());
}

// DRAW
function drawFlower(f) {
  let g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.size * 3);
  g.addColorStop(0, "rgba(255,182,193,1)");
  g.addColorStop(1, "rgba(255,105,180,0)");

  ctx.beginPath();
  ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
}

function drawStar(s) {
  ctx.beginPath();
  ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
  ctx.fillStyle = "white";
  ctx.globalAlpha = s.alpha;
  ctx.fill();
  ctx.globalAlpha = 1;
}

// UPDATE
function update() {
  flowers.forEach(f => {
    f.y -= f.speed;
    f.sway += 0.02;
    f.x += Math.sin(f.sway) * 0.5;

    if (f.size < f.maxSize) f.size += f.growth;

    if (f.y < -10) Object.assign(f, createFlower());
  });

  stars.forEach(s => {
    s.alpha += s.twinkle;
    if (s.alpha <= 0 || s.alpha >= 1) s.twinkle *= -1;
  });
}

// LOOP
function animate() {
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  stars.forEach(drawStar);
  flowers.forEach(drawFlower);

  update();
  requestAnimationFrame(animate);
}
</script>

</body>
</html>
